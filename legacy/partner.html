<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="robots" content="noindex">
  <title>Cashflowshit Partner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login partner -->
  <section class="lock" id="partnerLock">
    <form class="lock__card" id="partnerForm" novalidate>
      <span class="topbar__logo lock__logo" aria-hidden="true">Rp</span>
      <h1 class="lock__title">Cashflowshit App</h1>
      <p class="lock__sub">Masuk sebagai partner.</p>
      <label class="field">
        <span>Password partner</span>
        <span class="pw">
          <input type="password" id="partnerPw" autocomplete="current-password" autocapitalize="off" spellcheck="false">
          <button type="button" class="pw__toggle" id="partnerPwToggle" aria-label="Tampilkan password">Lihat</button>
        </span>
      </label>
      <p class="form-error" id="partnerError" role="alert"></p>
      <button type="submit" class="btn btn--primary btn--block" id="partnerSubmit">Masuk</button>
      <a class="link-btn lock__owner" href="./">← Masuk sebagai pemilik</a>
    </form>
  </section>

  <!-- Dashboard partner -->
  <div class="app" id="partnerApp" hidden>
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__logo" aria-hidden="true">Rp</span>
        <div>
          <h1>Cashflowshit App</h1>
          <p class="topbar__sub" id="partnerSub">Partner</p>
        </div>
      </div>
      <div class="topbar__actions">
        <button class="icon-btn" id="btnPartnerRefresh" aria-label="Muat ulang data" title="Muat ulang data">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="btnPartnerLogout" aria-label="Keluar" title="Keluar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="tiles tiles--partner" aria-label="Ringkasan">
        <div class="tile">
          <p class="tile__label"><span class="tile__dot tile__dot--good"></span>Total sudah diterima</p>
          <p class="tile__value tile__value--good" id="pReceived">—</p>
          <p class="tile__meta" id="pReceivedMeta">&nbsp;</p>
        </div>
        <div class="tile">
          <p class="tile__label"><span class="tile__dot tile__dot--warn"></span>Belum dibayar</p>
          <p class="tile__value tile__value--due" id="pOutstanding">—</p>
          <p class="tile__meta" id="pOutstandingMeta">&nbsp;</p>
        </div>
      </section>

      <div id="pMonths"></div>
      <p class="empty" id="pEmpty" hidden>Belum ada data payout.</p>
    </main>

    <footer class="footer">
      <p id="pUpdated">—</p>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="partner.js"></script>
</body>
</html>
