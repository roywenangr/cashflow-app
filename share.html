<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="robots" content="noindex">
  <title>Detail Payout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__logo" aria-hidden="true">Rp</span>
        <div>
          <h1 id="shareTitle">Detail payout</h1>
          <p class="topbar__sub" id="shareSub">Memuat…</p>
        </div>
      </div>
    </header>

    <main>
      <p class="empty" id="shareStatus">Memuat detail payout…</p>

      <div id="shareBody" hidden>
        <section class="card">
          <div class="card__head">
            <h3 class="card__title">Ringkasan</h3>
            <span class="badge badge--paid"><span class="badge__dot"></span>Paid</span>
          </div>
          <div class="termin__figures share__figures" id="shareFigures"></div>
          <div class="termin__share">
            <p class="termin__share-label"><span class="tile__dot tile__dot--good"></span>Sudah ditransfer</p>
            <p class="termin__share-value" id="sharePaid">—</p>
          </div>
          <p class="termin__note" id="sharePaidNote"></p>
        </section>

        <section class="card" id="shareProofCard" hidden>
          <div class="card__head">
            <h3 class="card__title">Bukti transfer</h3>
          </div>
          <div class="proof__list share__proofs" id="shareProofs"></div>
          <p class="form-error" id="shareProofError" role="alert"></p>
        </section>

        <section class="card">
          <div class="card__head">
            <h3 class="card__title">Invoice</h3>
            <span class="chip" id="shareEntryCount">0 Invoice</span>
          </div>
          <ul class="entries" id="shareEntries"></ul>
          <p class="empty" id="shareEntriesEmpty" hidden>Tidak ada invoice.</p>
        </section>

        <section class="card" id="shareSubsidyCard" hidden>
          <div class="card__head">
            <h3 class="card__title">Subsidi Silang</h3>
          </div>
          <ul class="entries subsidies" id="shareSubsidies"></ul>
        </section>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="share.js"></script>
</body>
</html>
